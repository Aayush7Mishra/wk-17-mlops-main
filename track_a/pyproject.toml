[project]
name = "telco-mlops"
version = "0.1.0"
description = "Reproducible Telco churn training, registry serving and drift monitoring"
requires-python = ">=3.12,<3.13"
dependencies = [
  "evidently==0.7.17",
  "fastapi==0.115.12",
  "matplotlib==3.10.1",
  "mlflow==2.22.1",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "sqlalchemy==2.0.41",
  "uvicorn==0.34.2",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.3.5", "ruff==0.11.11"]

[project.scripts]
telco-train = "telco_mlops.train:main"
telco-monitor = "telco_mlops.monitor:main"
telco-data = "telco_mlops.data:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telco_mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
