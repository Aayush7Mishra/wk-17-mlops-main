[project]
name = "wk-16-agentic-ai"
version = "1.1.0"
description = "Production-ready RAG assistant with tool calling, provider fallback, and a Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "fastembed>=0.4.2,<1.0",
    "httpx>=0.27.0,<1.0",
    "openai>=1.60.0,<3.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    "pypdf>=5.0.0,<7.0",
    "python-multipart>=0.0.18,<1.0",
    "qdrant-client>=1.12.0,<2.0",
    "redis>=5.2.0,<8.0",
    "streamlit>=1.41.0,<2.0",
    "uvicorn[standard]>=0.34.0,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0",
    "pytest-asyncio>=0.25.0,<2.0",
    "ruff>=0.9.0,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
