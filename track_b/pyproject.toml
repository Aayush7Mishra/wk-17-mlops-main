[project]
name = "week17-agentic-mlops"
version = "1.0.0"
description = "Tracked W16 agent configurations and LLM regression gates"
requires-python = ">=3.11,<3.13"
dependencies = [
  "evidently==0.6.7",
  "mlflow==2.22.2",
  "pandas>=2.2,<3",
  "openai>=1.60,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "tabulate>=0.9,<1",
  "sqlalchemy==2.0.41",
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = [".", "assistant"]
asyncio_mode = "auto"
testpaths = ["tests"]
